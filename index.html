<!doctype html>
<html lang="en">
<head>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0710;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}

  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  /* ---- touch controls ---- */
  #touch{display:none;position:fixed;left:0;right:0;bottom:0;height:var(--padh,200px);pointer-events:none;
    padding:0 max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));box-sizing:border-box}

  #pad-tap .hint{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ffffff80;font:10px "Press Start 2P",monospace}
  /* landscape phones: controls float over the sides of the picture */
  @media (orientation:landscape){ #touch{--padh:100%} .pad{inset:auto 14px 10px 14px}
    #dpad{width:140px;height:140px} #dpad .l{top:56px} #dpad .r{top:56px} #dpad .d{left:60px} #knob{left:42px;top:42px}
    #pad-tap{display:none!important}
    .pad .cluster{flex-direction:column;align-items:center}
    .pad .col{gap:10px} .b{width:66px;height:66px} .b.big{width:88px;height:88px} .b.small{width:54px;height:54px} }
  /* ---- the parody store page ---- */
  #store{position:fixed;inset:0;overflow:auto;z-index:10;background:#1b2838;color:#c6d4df;font:14px/1.45 Arial,Helvetica,sans-serif;touch-action:pan-y;-webkit-user-select:text;user-select:text}

  .st-top nav{display:flex;gap:20px}
  .st-top nav a{font-size:14px;letter-spacing:1px;color:#dcdedf}

  .st-acc{margin-left:auto;font-size:12px;color:#b8b6b4;display:flex;gap:6px;align-items:center}
  .st-install{background:#5c7e10;color:#d2efa9;padding:4px 10px;font-size:12px;margin-right:8px}
  .st-body{background:radial-gradient(ellipse at top,#2a475e 0,#1b2838 60%);padding-bottom:40px}
  .st-sub{display:flex;gap:2px;align-items:center;background:linear-gradient(90deg,rgba(62,103,150,.92) 11%,rgba(58,120,177,.8) 25%,rgb(15,33,110) 100%);box-shadow:0 0 3px #000;margin:20px 0 14px;flex-wrap:wrap}
  .st-sub a{padding:9px 13px;color:#e5e5e5;font-size:13px}
  .st-sub input{margin-left:auto;margin-right:6px;background:#316282;border:0;color:#fff;padding:6px 8px;border-radius:3px;width:150px}
  .st-crumb{font-size:12px;color:#8f98a0;margin-bottom:4px}
  .st-body h1{color:#fff;font-weight:normal;font-size:26px;margin:0 0 12px}
  .st-main{display:flex;gap:14px;background:rgba(0,0,0,.2);padding:0 0 12px}
  .st-media{flex:1 1 600px;min-width:0}
  #st-big{width:100%;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated;display:block;background:#000}
  .st-thumbs{display:flex;gap:4px;overflow-x:auto;margin-top:6px;padding-bottom:4px}

  .st-cart{background:linear-gradient(to right,#75b022 5%,#588a1b 95%);color:#d2efa9;border:0;border-radius:2px;padding:0 16px;font-size:15px;cursor:pointer}

  .st-left h3,.st-right h3{color:#fff;font-size:14px;letter-spacing:2px;font-weight:normal;border-bottom:1px solid #2a475e;padding-bottom:4px;margin:24px 0 10px;background:linear-gradient(to right,rgba(43,79,108,.7),transparent)}
  .st-left p{font-size:14px;color:#acb2b8}
  .st-req{display:flex;gap:20px;font-size:12px;color:#acb2b8}.st-req>div{flex:1}.st-req b{color:#c6d4df}

  @media (max-width:860px){ .st-main,.st-cols{flex-direction:column} .st-side,.st-right,.st-media,.st-left{flex:none} .st-top nav,.st-acc{display:none} .st-sub a{padding:7px 8px;font-size:12px} .st-btnrow{position:static;margin-top:12px;display:inline-flex} .st-buy{padding-bottom:16px} }
  body.drive-mode .pad .cluster{display:none}
  body.ops-mode [data-k="boot"]{display:none}
  body.m-none #touch{display:none}

</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="180"></canvas></div>
<div id="store" hidden></div>
<div id="touch">
  <div id="pad-play" class="pad">
    <div id="dpad"><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="d">&#9660;</span><div id="knob"></div></div>
    <div class="cluster">
      <div class="col"><div class="b small" data-k="boot">BOOT</div><div class="b" data-k="attack">DIG</div></div>
      <div class="b big" data-k="jump">JUMP</div>
    </div>
  </div>
  <div id="pad-menu" class="pad">
    <div class="cluster"><div class="col"><div class="b" data-k="mUp">&#9650;</div><div class="b" data-k="mDown">&#9660;</div></div></div>
    <div class="cluster"><div class="b" data-k="back">BACK</div><div class="b big" data-k="ok">OK</div></div>
  </div>
  <div id="pad-tap" class="pad"><div class="hint" data-k="ok">TAP TO CONTINUE</div></div>
</div>

<script>
'use strict';
/* =====================================================================
   DIGGER: DIGG. OR DIE. — Tom Cruise vs. The Critics
   A parody shovel-platformer riffing on the movie "Digger". Everything (art, sound, music) is
   generated in code, so this single file is the whole game.
   ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VW = 320, VH = 180, TS = 16, GRAV = 0.25;
const FONT = '"Press Start 2P", monospace';

function resize() {
  const touch = document.body.classList.contains('touch'), portrait = innerHeight > innerWidth;
  const padH = touch && portrait ? Math.round(Math.min(240, innerHeight * 0.42)) : 0;
  document.documentElement.style.setProperty('--padh', padH + 'px');
  document.getElementById('wrap').style.bottom = padH + 'px';
  const side = touch && !portrait ? Math.min(170, innerWidth * 0.2) : 0;
  document.getElementById('wrap').style.left = side + 'px'; document.getElementById('wrap').style.right = side + 'px';
  const s = Math.min((innerWidth - side * 2) / VW, (innerHeight - padH) / VH);
  const sc = s >= 2 && !touch ? Math.floor(s) : s;
  cv.style.width = VW * sc + 'px';
  cv.style.height = VH * sc + 'px';
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sign = v => (v < 0 ? -1 : 1);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ----------------------------- INPUT -------------------------------- */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', Space: 'jump', KeyJ: 'jump',
  KeyX: 'attack', KeyK: 'attack', KeyC: 'boot', KeyL: 'boot', ShiftLeft: 'sprint', ShiftRight: 'sprint',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute'
};
// Menu keys for the story scenes + the turn-based battle
const MENUMAP = {
  ArrowUp: 'mUp', KeyW: 'mUp', ArrowLeft: 'mUp', KeyA: 'mUp', ArrowDown: 'mDown', KeyS: 'mDown', ArrowRight: 'mDown', KeyD: 'mDown',
  KeyZ: 'ok', Space: 'ok', Enter: 'ok', KeyJ: 'ok', KeyX: 'back', KeyK: 'back', Escape: 'back', Backspace: 'back'
};
function press(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; initAudio(); }
function release(k) { keys[k] = false; }
const ARROWMAP = { ArrowUp: 'aU', KeyW: 'aU', ArrowDown: 'aD', KeyS: 'aD', ArrowLeft: 'aL', KeyA: 'aL', ArrowRight: 'aR', KeyD: 'aR' };
addEventListener('keydown', e => {
  if (state === 'store') return; // let the page scroll and type normally
  const k = KEYMAP[e.code], m = MENUMAP[e.code], a = ARROWMAP[e.code]; if (!k && !m && !a) return; e.preventDefault();
  if (k) press(k); if (m) press(m); if (a) press(a);
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code], m = MENUMAP[e.code], a = ARROWMAP[e.code]; if (!k && !m && !a) return;
  if (k) release(k); if (m) release(m); if (a) release(a);
});
const tapAdvances = () => ['title', 'fresh', 'vn', 'blackout', 'cliff'].includes(state);
// Mouse / finger on the picture itself: advance story, or pick menu items and targets in battle
cv.addEventListener('pointerdown', e => {
  initAudio();
  const r = cv.getBoundingClientRect(), gx = (e.clientX - r.left) * VW / r.width, gy = (e.clientY - r.top) * VH / r.height;
  if (state === 'rpg') { rpgTap(gx, gy); return; }
  if (state === 'ice') { iceTap(gx, gy); return; }
  if (tapAdvances()) { press('start'); press('ok'); }
});
cv.addEventListener('pointerup', () => { release('start'); release('ok'); });
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
// Buttons: each finger is tracked by id, so sliding a thumb off a button never drops the input
const fingers = new Map();
function bindButton(el) {
  const ks = el.dataset.k.split(' ');
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) fingers.set(t.identifier, el);
    el.classList.add('on'); ks.forEach(press); if (state === 'title' || state === 'blackout') press('start');
  }, { passive: false });
}
document.querySelectorAll('#touch [data-k]').forEach(bindButton);
function endTouch(e) {
  for (const t of e.changedTouches) {
    const el = fingers.get(t.identifier); if (!el) continue;
    fingers.delete(t.identifier);
    if (![...fingers.values()].includes(el)) { el.classList.remove('on'); el.dataset.k.split(' ').forEach(release); release('start'); }
  }
}
addEventListener('touchend', endTouch); addEventListener('touchcancel', endTouch);
// Analog-ish D-pad: roll your thumb around, no lifting needed
const dpad = document.getElementById('dpad'), knob = document.getElementById('knob');
let dpadId = null;
function setHeld(k, on) { if (on) press(k); else release(k); }
function dpadAt(t) {
  const r = dpad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy; const m = r.width * 0.32, d = Math.hypot(dx, dy);
  if (d > m) { dx *= m / d; dy *= m / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const dz = r.width * 0.1;
  setHeld('left', dx < -dz); setHeld('right', dx > dz); setHeld('down', dy > r.height * 0.18 && Math.abs(dy) > Math.abs(dx) * 0.6);
}
function dpadEnd() { dpadId = null; knob.style.transform = ''; ['left', 'right', 'down'].forEach(k => release(k)); }
dpad.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; dpadId = t.identifier; dpadAt(t); }, { passive: false });
addEventListener('touchmove', e => { if (state === 'store') return; for (const t of e.changedTouches) if (t.identifier === dpadId) dpadAt(t); e.preventDefault(); }, { passive: false });
addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === dpadId) dpadEnd(); });
addEventListener('touchcancel', dpadEnd);
// Which control set is showing follows the game mode
let padMode = '';
function syncPad() {
  const m = ['play', 'dead', 'ops', 'drive'].includes(state) ? 'm-play' : state === 'rpg' ? 'm-menu' : state === 'store' || state === 'demo' ? 'm-none' : 'm-tap';
  document.body.classList.toggle('ops-mode', state === 'ops' || state === 'drive');
  document.body.classList.toggle('drive-mode', state === 'drive');
  const dig = document.querySelector('[data-k="attack"]'), lbl = state === 'ops' ? 'FIRE' : 'DIG'; if (dig.textContent !== lbl) dig.textContent = lbl;
  const hint = document.querySelector('#pad-tap .hint'), ht = state === 'ice' ? 'TAP TILES TO ROTATE' : 'TAP TO CONTINUE'; if (hint.textContent !== ht) hint.textContent = ht;
  if (m !== padMode) { document.body.classList.remove('m-play', 'm-menu', 'm-tap', 'm-none'); document.body.classList.add(m); padMode = m; fingers.clear(); dpadEnd(); for (const k in keys) keys[k] = false; resize(); }
  if (m === 'm-play') {
    dpad.querySelector('.l').classList.toggle('on', !!keys.left); dpad.querySelector('.r').classList.toggle('on', !!keys.right); dpad.querySelector('.d').classList.toggle('on', !!keys.down);
    document.querySelector('[data-k="boot"]').classList.toggle('boot-ready', bootMeter >= 100);
  }
}

/* ----------------------------- AUDIO -------------------------------- */
let actx = null, muted = false, master = null, noiseBuf = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.35; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { actx = null; }
}
function tone(type, f0, f1, dur, vol = 0.3, when = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1200) {
  if (!actx || muted) return;
  const t = actx.currentTime, s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  jump: () => tone('square', 330, 660, 0.12, 0.15),
  swing: () => noise(0.08, 0.25, 3000),
  hit: () => { tone('square', 220, 80, 0.12, 0.25); noise(0.06, 0.2, 2000); },
  dig: () => { noise(0.15, 0.35, 700); tone('triangle', 120, 60, 0.12, 0.3); },
  gem: () => { tone('sine', 988, 988, 0.06, 0.2); tone('sine', 1319, 1319, 0.12, 0.2, 0.05); },
  bounce: () => tone('square', 440, 990, 0.1, 0.18),
  hurt: () => { tone('sawtooth', 400, 90, 0.3, 0.25); },
  throw: () => tone('triangle', 600, 300, 0.1, 0.12),
  splat: () => noise(0.12, 0.25, 900),
  check: () => { [523, 659, 784].forEach((f, i) => tone('square', f, f, 0.1, 0.15, i * 0.08)); },
  boom: () => { noise(0.4, 0.4, 500); tone('sawtooth', 120, 40, 0.4, 0.3); },
  win: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('square', f, f, 0.15, 0.15, i * 0.12)); },
  whistle: () => tone('square', 1400, 260, 0.7, 0.12),
  die: () => { [392, 330, 262, 196].forEach((f, i) => tone('square', f, f * 0.98, 0.18, 0.18, i * 0.15)); }
};

/* ------------------------------ MUSIC -------------------------------
   A tiny generative score. Every track is built from sections (intro,
   verse, chorus, bridge, breakdown) with their own chords, bass, drums and
   arrangement. Melodies grow from a motif that mutates each time a section
   comes back, phrases end in drum fills, and every playthrough gets a new
   seed, so no loop plays out exactly the same way twice. All original.
   -------------------------------------------------------------------- */
const N = n => 440 * Math.pow(2, (n - 69) / 12);
const SCALES = {
  minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10],
  harm: [0, 2, 3, 5, 7, 8, 11], phryg: [0, 1, 3, 5, 7, 8, 10], mixo: [0, 2, 4, 5, 7, 9, 10]

/* --------------------------- EFFECTS ------------------------------- */

function updatePlayer() {
  const p = player;

  if (!move || (move !== p.face && p.onGround)) { p.runT = 0; if (p.onGround || !move) p.sprint = false; }
  if (keys.sprint && move) p.sprint = true;

  }
  const speed = p.sprint ? 2.3 : 1.4;
  if (p.knock > 0) p.knock--;

    superBoot = { x: clamp(aim - 36, cam.x + 8, cam.x + VW - 84), y: -150, vy: 2, phase: 'drop', t: 0 };

/* ----------------------------- ENEMIES ------------------------------ */
function hurtEnemy(e, dmg, fromX) {

function updateEnemy(e) {

  if (!e.boss) e.t++; // the boss uses t as its own state timer
  if (e.inv > 0) e.inv--; if (e.flash > 0) e.flash--;
  if (e.say && --e.say.t <= 0) e.say = null;
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2), dist = Math.hypot(dx, dy);

        if (!e.enraged && e.hp <= e.maxHp / 2) { e.enraged = true; e.say = { text: "I'M GIVING IT A D!", t: 90 }; }

/* ---------------------------- MAIN UPDATE --------------------------- */
function update() {
  frame++;
  if (pressed.mute) muted = !muted;
  if (state === 'title') { if (pressed.start || pressed.jump || pressed.attack) newGame(); return; }
  if (state === 'fresh') {
    freshT++; const cutF = freshCut() * 2;
    if ((pressed.start || pressed.ok) && freshT > 20 && freshT < cutF) freshT = cutF;
    else if (freshT < cutF && freshT % 4 === 0) blip();
    if (freshT === cutF + 1) { noise(0.6, 0.35, 4000); [880, 660, 880, 660].forEach((f, i) => tone('square', f, f, 0.14, 0.12, 0.1 + i * 0.16)); }
    if (freshT > cutF + 110) startVN(INTRO, () => startOps());
    return;
  }
  if (state === 'vn') { updateVN(); decayShake(); return; }
  if (state === 'rpg') { updateRPG(); decayShake(); return; }
  if (state === 'ops') { updateOps(); decayShake(); return; }
  if (state === 'drive') { updateDrive(); return; }
  if (state === 'cliff') { updateCliff(); return; }
  if (state === 'ice') { updateIce(); return; }
  if (state === 'demo') { updateDemo(); return; }
  if (state === 'store') return;
  if (state === 'blackout') { if (++creditsT > 150) state = 'title'; return; }
  if (state === 'play' && pressed.pause) paused = !paused;
  if (paused) return;
  if (banner && --banner.t <= 0) banner = null;

  if (state === 'play') updatePlayer();
  else if (state === 'dead') { if (--deadT <= 0) respawn(); }

  const p = player;
  // Enemies
  const vis = e => e.boss || Math.abs(e.x - p.x) < 260;
  for (const e of enemies) if (!e.dead && vis(e)) updateEnemy(e);

  if (state === 'play') {
    // Pogo hits on enemies
    if (p.pogo && p.vy > 0) {
      const box = { x: p.x, y: p.y + p.h - 4, w: p.w, h: 8 };
      for (const e of enemies) if (!e.dead && overlap(box, e) && p.y + p.h - 6 < e.y + e.h / 2) {
        if (hurtEnemy(e, 1, p.x + p.w / 2) || e.inv > 0) { pogoBounce(); p.inv = Math.max(p.inv, 6); break; }
      }
    }
    // Shovel swing hits
    const sb = swingBox();
    if (sb) {
      for (const e of enemies) if (!e.dead && e.hitBy !== p.atkId && overlap(sb, e)) {
        if (hurtEnemy(e, e.boss ? 1 : 1, p.x + p.w / 2)) e.hitBy = p.atkId;
      }
      const l = Math.floor(sb.x / TS), r = Math.floor((sb.x + sb.w) / TS), t = Math.floor(sb.y / TS), bt = Math.floor((sb.y + sb.h) / TS);
      for (let tx = l; tx <= r; tx++) for (let ty = t; ty <= bt; ty++) digTile(tx, ty);
      for (const pr of projectiles) if (pr.type !== 'ink' && overlap(sb, pr)) {
        pr.life = 0; burst(pr.x + 3, pr.y + 3, 6, ['#fff', '#ffd84a'], 2); popup(pr.x, pr.y - 4, 'DEFLECT!', '#8cf', 30); sfx.bounce();
      }
    }
    // Contact damage
    for (const e of enemies) if (!e.dead && overlap(p, e) && !(e.boss && !['charge', 'air'].includes(e.state))) {
      if (e.stun > 0 && !e.boss) continue;
      hurtPlayer(1, e.x + e.w / 2);
    }
  }

  if (superBoot) updateSuperBoot();

  // Projectiles
  for (const pr of projectiles) {
    pr.t++; pr.life--;
    pr.vy += pr.g; pr.x += pr.vx; pr.y += pr.vy;
    if (pr.type === 'review') pr.y += Math.sin(pr.t * 0.2) * 0.4;
    const tx = Math.floor((pr.x + pr.w / 2) / TS), ty = Math.floor((pr.y + pr.h / 2) / TS);
    if (solid(tx, ty) || pr.y > LH * TS) {
      if (pr.type === 'ink' && !solid(tx, ty - 1) && pr.y < LH * TS) { /* ink rolls along the floor */ }
      else {
        pr.life = 0;
        if (pr.type === 'tomato') { burst(pr.x + 3, pr.y + 3, 10, ['#d22', '#f55', '#7a0'], 1.8); sfx.splat(); }
        else if (pr.type === 'pencil') { burst(pr.x + 2, pr.y + 12, 6, ['#fc3', '#333'], 1.5); }
      }
    }
    if (state === 'play' && pr.life > 0 && overlap(p, pr)) { hurtPlayer(pr.dmg, pr.x + pr.w / 2); pr.life = 0; }
  }
  projectiles = projectiles.filter(pr => pr.life > 0);

  // Gems
  for (const g of gems) {
    g.t += 0.1;
    if (!g.st) {
      g.life--; physics(g, 0.2);
      if (g.onGround) { g.vx *= 0.8; }
      if (g.y > LH * TS + 20) g.life = 0;
    }
    if (state === 'play' && g.life > 0 && overlap(p, g) && (g.st || g.life < 590)) {
      g.life = 0; money += g.val; sfx.gem(); addMeter(g.val >= 10 ? 5 : 2);
      popup(g.x + 4, g.y - 2, '+$' + g.val + 'M', g.c, 35);
    }
  }
  gems = gems.filter(g => g.life > 0);

  // Particles & popups
  for (const pt of particles) { pt.vy += pt.g; pt.x += pt.vx; pt.y += pt.vy; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  for (const pu of popups) { pu.t--; pu.y -= 0.35; }
  popups = popups.filter(pu => pu.t > 0);

  // Camera
  let target = p.x + p.w / 2 - VW / 2 + p.face * 24;
  if (bossActive) target = ARENA_X * TS;
  target = clamp(target, 0, LW * TS - VW);
  cam.x += (target - cam.x) * (bossActive ? 0.08 : 0.12);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;

  if (boss.dead && winT > 0 && --winT <= 0) { state = 'fresh'; freshT = 0; sfx.win(); }
}

// A rough pixel map of Europe (yes, Italy is a boot)
const EU = [
  '.............##...........',
  '............####.....###..',
  '.....#.....#####....#####.',
  '....##.....####....######.',
  '...###....#####...#######.',
  '....#....######..########.',
  '.......##################.',
  '..##..###################.',
  '.###.####################.',
  '..##..##################..',
  '......#################...',
  '....####.######.######....',
  '...#####..####...####.....',
  '....###....###....##......',
  '.....#......##.....#......',
  '............#.............'
];
function drawEurope(x, y, s, mode, prog) {
  const W = EU[0].length;
  R(x, y, W * s, EU.length * s, '#123c6a');
  for (let i = 0; i < 6; i++) R(x + ((frame * 0.3 + i * 37) % (W * s - 6)), y + 4 + i * 10, 6, 1, '#2a5a8a');
  const burn = mode === 'burn' ? prog : mode === 'burnt' ? 1 : mode === 'heal' ? 1 - prog : 0;
  for (let r = 0; r < EU.length; r++) for (let c = 0; c < W; c++) {
    if (EU[r][c] !== '#') continue;
    let col = r < 2 ? '#e8f4ff' : '#4f9a4a';
    if (c / W < 0.52 * burn) {
      if (hash(c, r) % 4 === 0) continue; // flooded
      col = hash(c, r + Math.floor(frame / 6)) % 3 === 0 ? '#ff9a2a' : '#c8321a';
    }
    R(x + c * s, y + r * s, s, s, col);
  }
}

/* =====================================================================
   THE CHASE: top-down motorcycle pursuit. Sam throws RAM.
   Steer any time; let go and the autopilot drives.

const DRIVE_LEN = 2100, LANES = [124, 160, 196];
let drv = null;
function startDrive() { state = 'drive'; drv = { t: 0, x: 160, idle: 0, auto: 0, ram: [], van: { x: 160, tx: 160 }, hit: 0, scroll: 0, throwT: 70, say: null, sayT: 90 }; }

  const d = drv; d.t++; d.scroll += 4.5;
  const move = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  if (move) { d.idle = 0; d.auto = 0; } else if (++d.idle > 70) d.auto = 1;
  let steer = move;
  if (d.auto) {
    let best = d.x, bestScore = -1e9;

      for (const r of d.ram) if (r.y > 30 && r.y < 160 && Math.abs(r.x - lx) < 20) score -= 50 + r.y;
      if (score > bestScore) { bestScore = score; best = lx; }

    steer = Math.abs(best - d.x) > 2 ? Math.sign(best - d.x) : 0;
  }
  d.x = clamp(d.x + steer * 2.6, 112, 208);
  if (Math.abs(d.van.x - d.van.tx) < 2 && Math.random() < 0.02) d.van.tx = pick(LANES);

  el.hidden = false; el.scrollTop = 0;

/* ------------------------------ LOOP -------------------------------- */
let last = performance.now(), acc = 0;
function step() { update(); for (const k in pressed) pressed[k] = false; }
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (!window.__freeze) step();
    acc -= 1000 / 60;
  }
  syncPad(); snapMaybe();
  draw();
  requestAnimationFrame(loop);
}
buildGrid();
(document.fonts ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve()).finally(() => requestAnimationFrame(loop));
