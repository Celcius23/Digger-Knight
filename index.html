<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Digger: Digg or Die</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0710;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  /* ---- touch controls ---- */
  #touch{display:none;position:fixed;left:0;right:0;bottom:0;height:var(--padh,200px);pointer-events:none;
    padding:0 max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));box-sizing:border-box}
  body.touch #touch{display:block}
  .pad{display:none;position:absolute;inset:0 14px 12px 14px;align-items:flex-end;justify-content:space-between}
  body.m-play #pad-play, body.m-menu #pad-menu, body.m-tap #pad-tap{display:flex}
  .pad *{pointer-events:auto;touch-action:none}
  .cluster{display:flex;align-items:flex-end;gap:12px}
  .b{border-radius:50%;border:2px solid #ffffff70;background:#ffffff14;color:#fff;font:11px "Press Start 2P",monospace;
    display:flex;align-items:center;justify-content:center;width:74px;height:74px;box-sizing:border-box}
  .b.big{width:96px;height:96px;font-size:13px;background:#ffd84a26;border-color:#ffd84ab0}
  .b.small{width:58px;height:58px;font-size:9px}
  .b.on{background:#ffffff55}
  .b.boot-ready{border-color:#ffd84a;color:#ffd84a;animation:pulse .6s infinite alternate}
  @keyframes pulse{to{background:#ffd84a40}}
  .col{display:flex;flex-direction:column;gap:12px;align-items:center}
  #dpad{position:relative;width:156px;height:156px;border-radius:50%;border:2px solid #ffffff50;background:#ffffff0f}
  #dpad span{position:absolute;color:#ffffff90;font:20px monospace}
  #dpad .l{left:14px;top:62px} #dpad .r{right:14px;top:62px} #dpad .d{left:68px;bottom:12px}
  #dpad span.on{color:#ffd84a}
  #knob{position:absolute;width:56px;height:56px;border-radius:50%;background:#ffffff30;left:50px;top:50px;pointer-events:none}
  #pad-tap{justify-content:center;align-items:center}
  #pad-tap .hint{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#ffffff80;font:10px "Press Start 2P",monospace}
  /* landscape phones: controls float over the sides of the picture */
  @media (orientation:landscape){ #touch{--padh:100%} .pad{inset:auto 14px 10px 14px}
    #dpad{width:140px;height:140px} #dpad .l{top:56px} #dpad .r{top:56px} #dpad .d{left:60px} #knob{left:42px;top:42px}
    #pad-tap{display:none!important}
    .pad .cluster{flex-direction:column;align-items:center}
    .pad .col{gap:10px} .b{width:66px;height:66px} .b.big{width:88px;height:88px} .b.small{width:54px;height:54px} }
  /* ---- the parody store page ---- */
  #store{position:fixed;inset:0;overflow:auto;z-index:10;background:#1b2838;color:#c6d4df;font:14px/1.45 Arial,Helvetica,sans-serif;touch-action:pan-y;-webkit-user-select:text;user-select:text}
  #store[hidden]{display:none}
  #store a{color:#c6d4df;cursor:pointer;text-decoration:none}
  .st-in{max-width:940px;margin:0 auto;padding:0 16px}
  .st-top{background:#171a21}
  .st-top .st-in{display:flex;align-items:center;gap:28px;height:64px}
  .st-logo{display:flex;align-items:center;gap:8px;color:#fff;font-weight:bold;font-size:22px;letter-spacing:2px}
  .st-orb{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#c6d4df 19% 32%,#171a21 33%);border:3px solid #c6d4df;box-sizing:border-box}
  .st-top nav{display:flex;gap:20px}
  .st-top nav a{font-size:14px;letter-spacing:1px;color:#dcdedf}
  .st-top nav a:first-child{color:#1a9fff;border-bottom:3px solid #1a9fff;padding-bottom:4px}
  .st-acc{margin-left:auto;font-size:12px;color:#b8b6b4;display:flex;gap:6px;align-items:center}
  .st-install{background:#5c7e10;color:#d2efa9;padding:4px 10px;font-size:12px;margin-right:8px}
  .st-body{background:radial-gradient(ellipse at top,#2a475e 0,#1b2838 60%);padding-bottom:40px}
  .st-sub{display:flex;gap:2px;align-items:center;background:linear-gradient(90deg,rgba(62,103,150,.92) 11%,rgba(58,120,177,.8) 25%,rgb(15,33,110) 100%);box-shadow:0 0 3px #000;margin:20px 0 14px;flex-wrap:wrap}
  .st-sub a{padding:9px 13px;color:#e5e5e5;font-size:13px}
  .st-sub input{margin-left:auto;margin-right:6px;background:#316282;border:0;color:#fff;padding:6px 8px;border-radius:3px;width:150px}
  .st-crumb{font-size:12px;color:#8f98a0;margin-bottom:4px}
  .st-body h1{color:#fff;font-weight:normal;font-size:26px;margin:0 0 12px}
  .st-main{display:flex;gap:14px;background:rgba(0,0,0,.2);padding:0 0 12px}
  .st-media{flex:1 1 600px;min-width:0}
  #st-big{width:100%;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated;display:block;background:#000}
  .st-thumbs{display:flex;gap:4px;overflow-x:auto;margin-top:6px;padding-bottom:4px}
  .st-thumbs img{width:116px;aspect-ratio:16/9;object-fit:cover;image-rendering:pixelated;opacity:.6;border:2px solid transparent;cursor:pointer;flex:none}
  .st-thumbs img.on{opacity:1;border-color:#fff}
  .st-side{flex:0 0 324px}
  .st-cap{width:100%;aspect-ratio:460/215;object-fit:cover;image-rendering:pixelated;display:block}
  .st-desc{font-size:13px;margin:10px 0 14px}
  .st-meta{font-size:12px;margin:5px 0;color:#c6d4df}
  .st-meta span{display:inline-block;width:110px;color:#556772;font-size:11px;text-transform:uppercase}
  .st-meta a{color:#66c0f4}
  .pos{color:#66c0f4;font-weight:normal}.neg{color:#a34c25}
  .st-meta i{color:#8f98a0;font-style:normal}
  .st-tags{margin-top:12px;display:flex;flex-wrap:wrap;gap:3px}
  .st-tags a{background:rgba(103,193,245,.2);color:#67c1f5 !important;padding:2px 7px;font-size:11px;border-radius:2px}
  .st-cols{display:flex;gap:24px;margin-top:24px}
  .st-left{flex:1 1 600px;min-width:0}.st-right{flex:0 0 300px}
  .st-buy{background:linear-gradient(-60deg,rgba(226,244,255,.3) 5%,rgba(84,107,115,.3) 95%);padding:16px 16px 26px;margin-bottom:28px;position:relative}
  .st-buy h2{color:#fff;font-size:21px;font-weight:normal;margin:0 0 6px}
  .st-small{font-size:12px;margin:0;color:#acdbf5}
  .st-btnrow{position:absolute;right:16px;bottom:-16px;display:flex;align-items:stretch;background:#000;padding:2px;border-radius:2px}
  .st-price{color:#c6d4df;font-size:13px;padding:8px 12px;background:#000}
  .st-price s{color:#738895;font-size:11px;margin-right:6px}
  .st-disc{background:#4c6b22;color:#beee11;font-size:20px;padding:4px 8px}
  .st-cart{background:linear-gradient(to right,#75b022 5%,#588a1b 95%);color:#d2efa9;border:0;border-radius:2px;padding:0 16px;font-size:15px;cursor:pointer}
  .st-cart:hover{background:linear-gradient(to right,#8ed629 5%,#6aa621 95%);color:#fff}
  .st-left h3,.st-right h3{color:#fff;font-size:14px;letter-spacing:2px;font-weight:normal;border-bottom:1px solid #2a475e;padding-bottom:4px;margin:24px 0 10px;background:linear-gradient(to right,rgba(43,79,108,.7),transparent)}
  .st-left p{font-size:14px;color:#acb2b8}
  .st-req{display:flex;gap:20px;font-size:12px;color:#acb2b8}.st-req>div{flex:1}.st-req b{color:#c6d4df}
  .st-rev{background:rgba(0,0,0,.25);padding:10px;margin-bottom:10px;font-size:13px}
  .st-rev b{display:block;color:#c1dbf4}.st-rev p{margin:6px 0 0;color:#acb2b8}
  .st-foot{margin-top:40px;font-size:11px;color:#8f98a0;text-align:center}
  .st-again{margin-top:12px;background:#3d4450;color:#fff;border:0;padding:8px 18px;border-radius:2px;cursor:pointer;font-size:13px}
  .st-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center}
  .st-modal[hidden]{display:none}
  .st-box{background:#1b2838;border:1px solid #66c0f4;padding:20px 24px;max-width:380px;box-shadow:0 0 30px #000}
  .st-box h2{color:#fff;margin:0 0 8px;font-weight:normal}
  .st-ok{background:linear-gradient(to right,#47bfff 5%,#1a44c2 60%);color:#fff;border:0;padding:8px 22px;border-radius:2px;cursor:pointer}
  @media (max-width:860px){ .st-main,.st-cols{flex-direction:column} .st-side,.st-right,.st-media,.st-left{flex:none} .st-top nav,.st-acc{display:none} .st-sub a{padding:7px 8px;font-size:12px} .st-btnrow{position:static;margin-top:12px;display:inline-flex} .st-buy{padding-bottom:16px} }
  body.ops-mode [data-k="boot"]{display:none}
  body.m-none #touch{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="180"></canvas></div>
<div id="store" hidden></div>
<div id="touch">
  <div id="pad-play" class="pad">
    <div id="dpad"><span class="l">&#9664;</span><span class="r">&#9654;</span><span class="d">&#9660;</span><div id="knob"></div></div>
    <div class="cluster">
      <div class="col"><div class="b small" data-k="boot">BOOT</div><div class="b" data-k="attack">DIG</div></div>
      <div class="b big" data-k="jump">JUMP</div>
    </div>
  </div>
  <div id="pad-tap" class="pad"><div class="hint" data-k="ok">TAP TO CONTINUE</div></div>
</div>

<script>
'use strict';
/* =====================================================================
   DIGGER: DIGG. OR DIE. — Tom Cruise vs. The Critics
   A parody shovel-platformer riffing on the movie "Digger". Everything (art, sound, music) is
   generated in code, so this single file is the whole game.
   ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VW = 320, VH = 180, TS = 16, GRAV = 0.25;
const FONT = '"Press Start 2P", monospace';

function resize() {
  const touch = document.body.classList.contains('touch'), portrait = innerHeight > innerWidth;
  const padH = touch && portrait ? Math.round(Math.min(240, innerHeight * 0.42)) : 0;
  document.documentElement.style.setProperty('--padh', padH + 'px');
  document.getElementById('wrap').style.bottom = padH + 'px';
  const side = touch && !portrait ? Math.min(170, innerWidth * 0.2) : 0;
  document.getElementById('wrap').style.left = side + 'px'; document.getElementById('wrap').style.right = side + 'px';
  const s = Math.min((innerWidth - side * 2) / VW, (innerHeight - padH) / VH);
  const sc = s >= 2 && !touch ? Math.floor(s) : s;
  cv.style.width = VW * sc + 'px';
  cv.style.height = VH * sc + 'px';
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sign = v => (v < 0 ? -1 : 1);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ----------------------------- INPUT -------------------------------- */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', Space: 'jump', KeyJ: 'jump',
  KeyX: 'attack', KeyK: 'attack', KeyC: 'boot', KeyL: 'boot', ShiftLeft: 'sprint', ShiftRight: 'sprint',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute'
};
// Menu keys for the story scenes + the turn-based battle
const MENUMAP = {
  ArrowUp: 'mUp', KeyW: 'mUp', ArrowLeft: 'mUp', KeyA: 'mUp', ArrowDown: 'mDown', KeyS: 'mDown', ArrowRight: 'mDown', KeyD: 'mDown',
  KeyZ: 'ok', Space: 'ok', Enter: 'ok', KeyJ: 'ok', KeyX: 'back', KeyK: 'back', Escape: 'back', Backspace: 'back'
};
function press(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; initAudio(); }
function release(k) { keys[k] = false; }
const ARROWMAP = { ArrowUp: 'aU', KeyW: 'aU', ArrowDown: 'aD', KeyS: 'aD', ArrowLeft: 'aL', KeyA: 'aL', ArrowRight: 'aR', KeyD: 'aR' };
addEventListener('keydown', e => {
  if (state === 'store') return; // let the page scroll and type normally
  const k = KEYMAP[e.code], m = MENUMAP[e.code], a = ARROWMAP[e.code]; if (!k && !m && !a) return; e.preventDefault();
  if (k) press(k); if (m) press(m); if (a) press(a);
});
addEventListener('keyup', e => {
  const k = KEYMAP[e.code], m = MENUMAP[e.code], a = ARROWMAP[e.code]; if (!k && !m && !a) return;
  if (k) release(k); if (m) release(m); if (a) release(a);
});
const tapAdvances = () => ['title', 'fresh', 'vn', 'blackout'].includes(state);
// Mouse / finger on the picture itself: advance story, or pick menu items and targets in battle
cv.addEventListener('pointerdown', e => {
  initAudio();
  const r = cv.getBoundingClientRect(), gx = (e.clientX - r.left) * VW / r.width, gy = (e.clientY - r.top) * VH / r.height;
  if (tapAdvances()) { press('start'); press('ok'); }
});
cv.addEventListener('pointerup', () => { release('start'); release('ok'); });
const IS_TOUCH = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
if (IS_TOUCH) document.body.classList.add('touch');
// Buttons: each finger is tracked by id, so sliding a thumb off a button never drops the input
const fingers = new Map();
function bindButton(el) {
  const ks = el.dataset.k.split(' ');
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) fingers.set(t.identifier, el);
    el.classList.add('on'); ks.forEach(press); if (state === 'title' || state === 'blackout') press('start');
  }, { passive: false });
}
document.querySelectorAll('#touch [data-k]').forEach(bindButton);
function endTouch(e) {
  for (const t of e.changedTouches) {
    const el = fingers.get(t.identifier); if (!el) continue;
    fingers.delete(t.identifier);
    if (![...fingers.values()].includes(el)) { el.classList.remove('on'); el.dataset.k.split(' ').forEach(release); release('start'); }
  }
}
addEventListener('touchend', endTouch); addEventListener('touchcancel', endTouch);
// Analog-ish D-pad: roll your thumb around, no lifting needed
const dpad = document.getElementById('dpad'), knob = document.getElementById('knob');
let dpadId = null;
function setHeld(k, on) { if (on) press(k); else release(k); }
function dpadAt(t) {
  const r = dpad.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  let dx = t.clientX - cx, dy = t.clientY - cy; const m = r.width * 0.32, d = Math.hypot(dx, dy);
  if (d > m) { dx *= m / d; dy *= m / d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  const dz = r.width * 0.1;
  setHeld('left', dx < -dz); setHeld('right', dx > dz); setHeld('down', dy > r.height * 0.18 && Math.abs(dy) > Math.abs(dx) * 0.6);
}
function dpadEnd() { dpadId = null; knob.style.transform = ''; ['left', 'right', 'down'].forEach(k => release(k)); }
dpad.addEventListener('touchstart', e => { e.preventDefault(); const t = e.changedTouches[0]; dpadId = t.identifier; dpadAt(t); }, { passive: false });
addEventListener('touchmove', e => { if (state === 'store') return; for (const t of e.changedTouches) if (t.identifier === dpadId) dpadAt(t); e.preventDefault(); }, { passive: false });
addEventListener('touchend', e => { for (const t of e.changedTouches) if (t.identifier === dpadId) dpadEnd(); });
addEventListener('touchcancel', dpadEnd);
// Which control set is showing follows the game mode
let padMode = '';
function syncPad() {
  const m = ['play', 'dead', 'shoot'].includes(state) ? 'm-play' : state === 'store' || state === 'demo' ? 'm-none' : 'm-tap';
  document.body.classList.toggle('ops-mode', state === 'shoot');
  const dig = document.querySelector('[data-k="attack"]'), lbl = state === 'shoot' ? 'FIRE' : 'DIG'; if (dig.textContent !== lbl) dig.textContent = lbl;
  if (m !== padMode) { document.body.classList.remove('m-play', 'm-tap', 'm-none'); document.body.classList.add(m); padMode = m; fingers.clear(); dpadEnd(); for (const k in keys) keys[k] = false; resize(); }
  if (m === 'm-play') {
    dpad.querySelector('.l').classList.toggle('on', !!keys.left); dpad.querySelector('.r').classList.toggle('on', !!keys.right); dpad.querySelector('.d').classList.toggle('on', !!keys.down);
    document.querySelector('[data-k="boot"]').classList.toggle('boot-ready', bootMeter >= 100);
  }
}

/* ----------------------------- AUDIO -------------------------------- */
let actx = null, muted = false, master = null, noiseBuf = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.35; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { actx = null; }
}
function tone(type, f0, f1, dur, vol = 0.3, when = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1200) {
  if (!actx || muted) return;
  const t = actx.currentTime, s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  jump: () => tone('square', 330, 660, 0.12, 0.15),
  swing: () => noise(0.08, 0.25, 3000),
  hit: () => { tone('square', 220, 80, 0.12, 0.25); noise(0.06, 0.2, 2000); },
  dig: () => { noise(0.15, 0.35, 700); tone('triangle', 120, 60, 0.12, 0.3); },
  gem: () => { tone('sine', 988, 988, 0.06, 0.2); tone('sine', 1319, 1319, 0.12, 0.2, 0.05); },
  bounce: () => tone('square', 440, 990, 0.1, 0.18),
  hurt: () => { tone('sawtooth', 400, 90, 0.3, 0.25); },
  throw: () => tone('triangle', 600, 300, 0.1, 0.12),
  splat: () => noise(0.12, 0.25, 900),
  check: () => { [523, 659, 784].forEach((f, i) => tone('square', f, f, 0.1, 0.15, i * 0.08)); },
  boom: () => { noise(0.4, 0.4, 500); tone('sawtooth', 120, 40, 0.4, 0.3); },
  win: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('square', f, f, 0.15, 0.15, i * 0.12)); },
  whistle: () => tone('square', 1400, 260, 0.7, 0.12),
  die: () => { [392, 330, 262, 196].forEach((f, i) => tone('square', f, f * 0.98, 0.18, 0.18, i * 0.15)); }
};

/* ------------------------------ MUSIC -------------------------------
   A tiny generative score. Every track is built from sections (intro,
   verse, chorus, bridge, breakdown) with their own chords, bass, drums and
   arrangement. Melodies grow from a motif that mutates each time a section
   comes back, phrases end in drum fills, and every playthrough gets a new
   seed, so no loop plays out exactly the same way twice. All original.
   -------------------------------------------------------------------- */
const N = n => 440 * Math.pow(2, (n - 69) / 12);
const SCALES = {
  minor: [0, 2, 3, 5, 7, 8, 10], major: [0, 2, 4, 5, 7, 9, 11], dorian: [0, 2, 3, 5, 7, 9, 10],
  harm: [0, 2, 3, 5, 7, 8, 11], phryg: [0, 1, 3, 5, 7, 8, 10], mixo: [0, 2, 4, 5, 7, 9, 10]
};
const deg = (key, sc, d) => { const n = sc.length; return key + sc[((d % n) + n) % n] + 12 * Math.floor(d / n); };
function rng(seed) { return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hashStr = s => { let h = 7; for (const c of s) h = h * 31 + c.charCodeAt(0) | 0; return h; };

// sec: prog = chord degree per bar; bass/drums/lead/arp = pattern names; pad = sustained chords
const SONGS = {
  title: { bpm: 108, key: 45, scale: 'minor', lead: 'triangle', form: ['A', 'B', 'A', 'C'], sec: {
    A: { prog: [0, 5, 2, 6], bass: 'pulse', drums: 'soft', lead: 'sparse', arp: 'slow' },

// '#' ground, 'D' diggable dirt, '^' sharpened-pencil spikes, '.' air
let LW = 107; const LH = 11;

function buildGrid() {

  const F = (x0, x1, y0, y1, c) => {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++)
      if (x >= 0 && x < LW && y >= 0 && y < LH) grid[y][x] = c;
  };
  F(0, LW - 1, 9, 10, '#'); F(0, 0, 0, 8, '#');
  // Act 1: the red carpet
  F(9, 10, 7, 8, 'D'); F(16, 18, 7, 7, '#');
  // Act 2: the pit of bloggers
  F(22, 32, 9, 10, '.'); F(24, 26, 8, 8, '#'); F(29, 30, 7, 7, '#');
  // Act 3: the dirt wall
  F(36, 48, 8, 8, '#'); F(41, 42, 5, 7, 'D'); F(45, 47, 6, 6, '#');
  // Act 4: the pencil pit. Stepping platforms are the safe route; bloggers
  // hover low in the gaps, so they're a bonus bounce (or a safety net), never required.
  F(54, 72, 9, 9, '^'); F(56, 58, 8, 8, '#'); F(61, 62, 8, 8, '#'); F(65, 66, 7, 7, '#'); F(69, 70, 8, 8, '#');

}

  if (e.vx > 0) {

  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / TS);

  }
}

  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h - 0.01) / TS);
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; break; }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / TS);
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { e.y = (ty + 1) * TS; e.vy = 0; break; }
  }
}

/* --------------------------- EFFECTS ------------------------------- */
function burst(x, y, n, colors, spd = 2, g = 0.15, life = 30) {

}
function popup(x, y, text, c = '#fff', t = 60) { popups.push({ x, y, text, c, t, t0: t }); }

function digTile(tx, ty) {

  grid[ty][tx] = '.';

/* ----------------------------- PLAYER ------------------------------- */
function hurtPlayer(dmg, srcX) {

  p.hp -= dmg; p.inv = 70; p.knock = 14; p.atk = 0; p.pogo = false; p.combo = 0;
  p.vx = (p.x + p.w / 2 < srcX ? -1.8 : 1.8); p.vy = -2.8;

function updatePlayer() {
  const p = player;
  const move = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  // "Cruise control": run long enough and Tom breaks into his trademark full sprint
  if (move && p.onGround && move === p.face) p.runT++;
  if (!move || (move !== p.face && p.onGround)) { p.runT = 0; if (p.onGround || !move) p.sprint = false; }
  if (keys.sprint && move) p.sprint = true;
  if (p.runT > 45 && !p.sprint) {
    p.sprint = true;
    if (!cruiseShown) { cruiseShown = true; popup(p.x + 5, p.y - 10, 'FULL THROTTLE!', '#ffd84a', 90); }
  }
  const speed = p.sprint ? 2.3 : 1.4;
  if (p.knock > 0) p.knock--;
  else {
    p.vx += (move * speed - p.vx) * (p.onGround ? 0.35 : 0.18);
    if (move && p.atk <= 0) p.face = move;
  }

  // Jump (with coyote time + input buffer)
  if (p.onGround) { p.coyote = 6; p.combo = 0; } else if (p.coyote > 0) p.coyote--;
  if (pressed.jump) p.jbuf = 7; else if (p.jbuf > 0) p.jbuf--;
  if (p.jbuf > 0 && p.coyote > 0 && p.knock <= 0) {
    p.vy = -4.6; p.coyote = 0; p.jbuf = 0; p.onGround = false; p.bouncing = false; sfx.jump();
  }
  if (!keys.jump && p.vy < -2 && !p.bouncing) p.vy = -2;
  if (p.vy >= 0) p.bouncing = false;

  // Shovel swing
  if (p.atkCd > 0) p.atkCd--;
  if (pressed.attack && p.atkCd <= 0 && p.knock <= 0) { p.atk = 16; p.atkCd = 20; p.atkId++; p.pogo = false; sfx.swing(); }
  if (p.atk > 0) p.atk--;

  // THE DIGGER BOOT: a giant cowboy boot stomps everything on screen
  if (pressed.boot && bootMeter >= 100 && !superBoot) {
    bootMeter = 0; sfx.whistle();
    const aim = bossActive && !boss.dead ? boss.x + boss.w / 2 : p.x + p.w / 2 + p.face * 56;
    superBoot = { x: clamp(aim - 36, cam.x + 8, cam.x + VW - 84), y: -150, vy: 2, phase: 'drop', t: 0 };
    banner = { lines: ['DIGG. OR DIE.', 'THE DIGGER BOOT!'], t: 90, y: 18 };
  } else if (pressed.boot && !superBoot) popup(p.x + 5, p.y - 10, 'BOOT ' + Math.floor(bootMeter) + '%', '#aaa', 30);

  // Boot stomp (pogo): hold DOWN in the air
  p.pogo = !p.onGround && keys.down && p.atk <= 0 && p.knock <= 0;

  // Pogo off dirt blocks (checked before landing so the block breaks instead)
  if (p.pogo && p.vy > 0) {
    const fy = p.y + p.h, box = { x: p.x + 1, y: fy, w: p.w - 2, h: Math.max(3, p.vy + 2) };
    const l = Math.floor(box.x / TS), r = Math.floor((box.x + box.w) / TS), ty = Math.floor((box.y + box.h) / TS);
    for (let tx = l; tx <= r; tx++) if (tileAt(tx, ty) === 'D' && fy <= ty * TS + 2) { digTile(tx, ty); pogoBounce(); break; }
  }

  physics(p);

  if (p.inv > 0) p.inv--;

    popup(c.x + 6, c.y - 6, "THAT'S A WRAP!", '#ffd84a', 90);

    burst(GATE_X * TS + 8, 8 * TS, 20, ['#888', '#ccc'], 2);

}

/* ----------------------------- ENEMIES ------------------------------ */
function hurtEnemy(e, dmg, fromX) {
  if (e.inv > 0 || e.dead || (e.boss && (e.state === 'wait' || e.state === 'intro' || e.state === 'dying'))) return false;
  e.hp -= dmg; e.inv = e.boss ? 22 : 10; e.flash = 10; if (e.boss) addMeter(12);

  if (!e.boss) { e.vx = sign(e.x - fromX) * 2; e.vy = -1.5; e.stun = 20; }
  if (e.hp <= 0) killEnemy(e);
  else if (e.boss && !e.enraged && e.hp <= e.maxHp / 2) { e.enraged = true; e.say = { text: "I'M GIVING IT A D!", t: 90 }; }
  return true;
}
function killEnemy(e) {

    projectiles = []; sfx.boom(); return;
  }

function updateEnemy(e) {
  const p = player;
  if (!e.boss) e.t++; // the boss uses t as its own state timer
  if (e.inv > 0) e.inv--; if (e.flash > 0) e.flash--;
  if (e.say && --e.say.t <= 0) e.say = null;
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2), dist = Math.hypot(dx, dy);

  if (e.type === 'critic') {
    if (e.stun > 0) { e.stun--; e.vx *= 0.85; }
    else if (e.throwT > 0) {
      e.throwT--; e.vx = 0;
      if (e.throwT === 12) {
        sfx.throw();
        projectiles.push({ type: 'review', x: e.x + e.w / 2 - 4, y: e.y + 3, w: 8, h: 6, vx: e.face * 1.9, vy: 0, g: 0, life: 200, t: 0, dmg: 1 });
      }
    } else {
      e.vx = e.dir * 0.5; e.face = e.dir;
      if (e.onGround) {
        const ahead = Math.floor((e.x + (e.dir > 0 ? e.w + 1 : -1)) / TS), below = Math.floor((e.y + e.h + 1) / TS);
        if (e.hitWall || !solid(ahead, below)) { e.dir *= -1; e.vx = e.dir * 0.5; }
      }
      if (--e.cool <= 0 && dist < 160 && Math.abs(dy) < 50) {
        e.dir = e.face = sign(dx); e.throwT = 32; e.cool = 140 + rand(0, 80);
        e.say = { text: pick(TAUNTS), t: 60 };
      }
    }
    physics(e);
  } else if (e.type === 'blogger') {
    if (e.chase && dist < 140) {
      e.bx += clamp(dx, -1, 1) * 0.45; e.by += clamp(dy, -1, 1) * 0.25;
      e.face = sign(dx);
    }
    e.x = e.bx; e.y = e.by + Math.sin(e.t * 0.06 + e.phase) * 6;
    if (!e.say && Math.random() < 0.003) e.say = { text: pick(BLOGS), t: 50 };
  } else if (e.type === 'tomato') {
    e.face = sign(dx);
    if (e.stun > 0) { e.stun--; e.vx *= 0.85; } else e.vx = 0;
    if (--e.cool <= 0 && dist < 190) {

      projectiles.push({ type: 'tomato', x: e.x + e.w / 2 - 3, y: e.y, w: 6, h: 6, vx, vy, g, life: 240, t: 0, dmg: 1 });
      sfx.throw(); e.cool = 120 + rand(0, 40);
      if (Math.random() < 0.4) e.say = { text: 'ROTTEN!', t: 50 };

function updateBoss(b, dx) {
  if (b.state === 'wait') { physics(b); return; }
  const arenaL = ARENA_X * TS, arenaR = (LW - 1) * TS;
  switch (b.state) {
    case 'intro': b.vx = 0; if (--b.t <= 0) { b.state = 'idle'; b.t = 40; } break;
    case 'idle':
      b.vx *= 0.8; b.face = sign(dx);
      if (--b.t <= 0) {
        const r = Math.random();
        if (r < 0.35) { b.state = 'windup'; b.t = 32; }
        else if (r < 0.7 && b.onGround) {
          b.state = 'air'; b.vy = -6.2;
          b.vx = clamp(dx / 62, -2.6, 2.6); b.t = 0;
        } else { b.state = 'throw'; b.t = b.enraged ? 70 : 54; }
      }
      break;
    case 'windup':
      b.vx = 0; if (b.t % 4 < 2) b.x += 0.5; else b.x -= 0.5;
      if (--b.t <= 0) { b.state = 'charge'; b.vx = b.face * (b.enraged ? 3.4 : 2.7); b.say = { text: 'THUMBS DOWN!', t: 50 }; }
      break;
    case 'charge':
      b.vx = b.face * (b.enraged ? 3.4 : 2.7);
      if (b.hitWall || b.x <= arenaL + 1 || b.x + b.w >= arenaR - 1) {
        b.state = 'stunned'; b.t = 60; b.vx = -b.face * 1.5; b.vy = -2.5; shake = 10; sfx.boom();
        for (let i = 0; i < (b.enraged ? 5 : 3); i++)
          projectiles.push({ type: 'pencil', x: rand(arenaL + 16, arenaR - 24), y: -20 - i * 30, w: 4, h: 14, vx: 0, vy: 0, g: 0.12, life: 240, t: 0, dmg: 1 });
      }
      break;
    case 'stunned': b.vx *= 0.9; if (--b.t <= 0) { b.state = 'idle'; b.t = b.enraged ? 22 : 40; } break;
    case 'air':
      b.t++;
      if (b.onGround && b.t > 5) {
        b.state = 'idle'; b.t = b.enraged ? 30 : 46; b.vx = 0; shake = 10; sfx.boom();
        const gy = b.y + b.h - 10;
        projectiles.push({ type: 'ink', x: b.x - 10, y: gy, w: 10, h: 10, vx: -2.6, vy: 0, g: 0, life: 150, t: 0, dmg: 1 });
        projectiles.push({ type: 'ink', x: b.x + b.w, y: gy, w: 10, h: 10, vx: 2.6, vy: 0, g: 0, life: 150, t: 0, dmg: 1 });
        burst(b.x + b.w / 2, b.y + b.h, 16, ['#888', '#a33', '#ccc'], 2.5);
      }
      break;
    case 'throw': {
      b.vx = 0; b.face = sign(dx);
      const shots = b.enraged ? [62, 46, 30, 14] : [40, 20];
      if (shots.includes(b.t)) {
        const p = player, T = 46, g = 0.15;
        const tdx = (p.x + p.w / 2) - (b.x + b.w / 2) + rand(-24, 24), tdy = (p.y) - (b.y + 6);
        if (Math.random() < 0.35) {
          const d = Math.hypot(tdx, tdy) || 1;
          projectiles.push({ type: 'review', x: b.x + b.w / 2, y: b.y + 8, w: 8, h: 6, vx: tdx / d * 1.8, vy: tdy / d * 1.8, g: 0, life: 200, t: 0, dmg: 1 });
        } else projectiles.push({ type: 'tomato', x: b.x + b.w / 2, y: b.y + 6, w: 6, h: 6, vx: clamp(tdx / T, -4, 4), vy: clamp((tdy - 0.5 * g * T * T) / T, -6, 0), g, life: 240, t: 0, dmg: 1 });
        sfx.throw();
      }
      if (--b.t <= 0) { b.state = 'idle'; b.t = 36; }
      break;
    }
    case 'dying':
      b.vx = 0;
      if (b.t % 8 === 0) { burst(b.x + rand(0, b.w), b.y + rand(0, b.h), 10, ['#fff', '#ffd84a', '#f84'], 3); sfx.hit(); shake = 4; }
      if (--b.t <= 0) {
        b.dead = true; sfx.boom(); shake = 14;
        burst(b.x + b.w / 2, b.y + b.h / 2, 60, ['#fff', '#ffd84a', '#5b2a86', '#f33'], 4);
        dropGems(b.x + b.w / 2, b.y, 150);
        popup(b.x + b.w / 2, b.y - 10, 'CERTIFIED FRESH!', '#7f7', 160);
        for (let y = 0; y <= 8; y++) grid[y][GATE_X] = '.';
        winT = 240;
      }
      break;
  }
  physics(b);
  b.x = clamp(b.x, arenaL, arenaR - b.w);

function addMeter(n) {

  bootMeter = Math.min(100, bootMeter + n);

}

  } else if (sb.phase === 'stomp') { if (sb.t > 45) sb.phase = 'rise'; }

  for (let x = cam.x; x < cam.x + VW; x += 6) burst(x, 9 * TS - 2, 1, ['#a0672f', '#ddd', '#c98a4b'], 2.5, 0.15, 30);
  for (const e of enemies) {

        e.state = 'stunned'; e.t = 90; e.vx = 0;
      }
    } else { e.hp = 0; killEnemy(e); }
  }

/* ---------------------------- MAIN UPDATE --------------------------- */
function update() {
  frame++;
  if (pressed.mute) muted = !muted;
  if (state === 'title') { if (pressed.start || pressed.jump || pressed.attack) newGame(); return; }
  if (state === 'fresh') {
    freshT++; const cutF = freshCut() * 2;
    if ((pressed.start || pressed.ok) && freshT > 20 && freshT < cutF) freshT = cutF;
    else if (freshT < cutF && freshT % 4 === 0) blip();
    if (freshT === cutF + 1) { noise(0.6, 0.35, 4000); [880, 660, 880, 660].forEach((f, i) => tone('square', f, f, 0.14, 0.12, 0.1 + i * 0.16)); }
    if (freshT > cutF + 110) startVN(INTRO, () => startShoot());
    return;
  }
  if (state === 'vn') { updateVN(); decayShake(); return; }
  if (state === 'shoot') { if (pressed.pause) paused = !paused; if (!paused) updateShoot(); return; }
  if (state === 'demo') { updateDemo(); return; }
  if (state === 'store') return;
  if (state === 'blackout') { if (++creditsT > 150) state = 'title'; return; }
  if (state === 'play' && pressed.pause) paused = !paused;
  if (paused) return;
  if (banner && --banner.t <= 0) banner = null;

  if (state === 'play') updatePlayer();
  else if (state === 'dead') { if (--deadT <= 0) respawn(); }

  const p = player;
  // Enemies
  const vis = e => e.boss || Math.abs(e.x - p.x) < 260;
  for (const e of enemies) if (!e.dead && vis(e)) updateEnemy(e);

  if (state === 'play') {
    // Pogo hits on enemies
    if (p.pogo && p.vy > 0) {
      const box = { x: p.x, y: p.y + p.h - 4, w: p.w, h: 8 };
      for (const e of enemies) if (!e.dead && overlap(box, e) && p.y + p.h - 6 < e.y + e.h / 2) {
        if (hurtEnemy(e, 1, p.x + p.w / 2) || e.inv > 0) { pogoBounce(); p.inv = Math.max(p.inv, 6); break; }
      }
    }
    // Shovel swing hits
    const sb = swingBox();
    if (sb) {
      for (const e of enemies) if (!e.dead && e.hitBy !== p.atkId && overlap(sb, e)) {
        if (hurtEnemy(e, e.boss ? 1 : 1, p.x + p.w / 2)) e.hitBy = p.atkId;
      }
      const l = Math.floor(sb.x / TS), r = Math.floor((sb.x + sb.w) / TS), t = Math.floor(sb.y / TS), bt = Math.floor((sb.y + sb.h) / TS);
      for (let tx = l; tx <= r; tx++) for (let ty = t; ty <= bt; ty++) digTile(tx, ty);
      for (const pr of projectiles) if (pr.type !== 'ink' && overlap(sb, pr)) {
        pr.life = 0; burst(pr.x + 3, pr.y + 3, 6, ['#fff', '#ffd84a'], 2); popup(pr.x, pr.y - 4, 'DEFLECT!', '#8cf', 30); sfx.bounce();
      }
    }

      if (e.stun > 0 && !e.boss) continue;
      hurtPlayer(1, e.x + e.w / 2);
    }
  }

  if (superBoot) updateSuperBoot();

  // Projectiles
  for (const pr of projectiles) {
    pr.t++; pr.life--;
    pr.vy += pr.g; pr.x += pr.vx; pr.y += pr.vy;
    if (pr.type === 'review') pr.y += Math.sin(pr.t * 0.2) * 0.4;

      else {
        pr.life = 0;

      }
    }
    if (state === 'play' && pr.life > 0 && overlap(p, pr)) { hurtPlayer(pr.dmg, pr.x + pr.w / 2); pr.life = 0; }
  }
  projectiles = projectiles.filter(pr => pr.life > 0);

  // Gems
  for (const g of gems) {
    g.t += 0.1;
    if (!g.st) {
      g.life--; physics(g, 0.2);
      if (g.onGround) { g.vx *= 0.8; }
      if (g.y > LH * TS + 20) g.life = 0;
    }
    if (state === 'play' && g.life > 0 && overlap(p, g) && (g.st || g.life < 590)) {
      g.life = 0; money += g.val; sfx.gem(); addMeter(g.val >= 10 ? 5 : 2);
      popup(g.x + 4, g.y - 2, '+$' + g.val + 'M', g.c, 35);
    }
  }
  gems = gems.filter(g => g.life > 0);

  // Particles & popups
  for (const pt of particles) { pt.vy += pt.g; pt.x += pt.vx; pt.y += pt.vy; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  for (const pu of popups) { pu.t--; pu.y -= 0.35; }
  popups = popups.filter(pu => pu.t > 0);

  // Camera
  let target = p.x + p.w / 2 - VW / 2 + p.face * 24;
  if (bossActive) target = ARENA_X * TS;
  target = clamp(target, 0, LW * TS - VW);
  cam.x += (target - cam.x) * (bossActive ? 0.08 : 0.12);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;

  if (boss.dead && winT > 0 && --winT <= 0) { state = 'fresh'; freshT = 0; sfx.win(); }
}

/* ------------------------------ LOOP -------------------------------- */
let last = performance.now(), acc = 0;
function step() { update(); for (const k in pressed) pressed[k] = false; }
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (!window.__freeze) step();
    acc -= 1000 / 60;
  }
  syncPad(); snapMaybe();
  draw();
  requestAnimationFrame(loop);
}
buildGrid();
