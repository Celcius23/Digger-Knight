<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Digger: Digg or Die</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0b0710;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;display:block}
  #touch{position:fixed;inset:auto 0 0 0;display:none;justify-content:space-between;padding:12px 16px;pointer-events:none}
  #touch .grp{display:flex;gap:10px;pointer-events:auto}
  #touch button{width:62px;height:62px;border-radius:50%;border:2px solid #fff8;background:#0007;color:#fff;
    font:10px "Press Start 2P",monospace;touch-action:none}
  #touch button.on{background:#fff4}
  body.touch #touch{display:flex}
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="320" height="180"></canvas></div>
<div id="touch">
  <div class="grp"><button data-k="left">&#9664;</button><button data-k="down">&#9660;</button><button data-k="right">&#9654;</button></div>
  <div class="grp"><button data-k="boot">BOOT</button><button data-k="attack">DIG</button><button data-k="jump">JUMP</button></div>
</div>
<script>
'use strict';
/* =====================================================================
   DIGGER: DIGG. OR DIE. — Tom Cruise vs. The Critics
   A parody shovel-platformer riffing on the movie "Digger". Everything (art, sound, music) is
   generated in code, so this single file is the whole game.
   ===================================================================== */
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
const VW = 320, VH = 180, TS = 16, GRAV = 0.25;
const FONT = '"Press Start 2P", monospace';

function resize() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  const sc = s >= 2 ? Math.floor(s) : s;
  cv.style.width = VW * sc + 'px';
  cv.style.height = VH * sc + 'px';
}
addEventListener('resize', resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sign = v => (v < 0 ? -1 : 1);
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ----------------------------- INPUT -------------------------------- */
const keys = {}, pressed = {};
const KEYMAP = {
  ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down', ArrowUp: 'jump', KeyW: 'jump', KeyZ: 'jump', Space: 'jump', KeyJ: 'jump',
  KeyX: 'attack', KeyK: 'attack', KeyC: 'boot', KeyL: 'boot', ShiftLeft: 'sprint', ShiftRight: 'sprint',
  Enter: 'start', KeyP: 'pause', Escape: 'pause', KeyM: 'mute'
};
function press(k) { if (!keys[k]) pressed[k] = true; keys[k] = true; initAudio(); }
function release(k) { keys[k] = false; }
addEventListener('keydown', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); press(k); });
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (!k) return; e.preventDefault(); release(k); });
cv.addEventListener('pointerdown', () => { if (state !== 'play') press('start'); });
cv.addEventListener('pointerup', () => release('start'));
if (matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window) document.body.classList.add('touch');
document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  const on = e => { e.preventDefault(); b.classList.add('on'); press(k); if (state !== 'play') press('start'); };
  const off = e => { e.preventDefault(); b.classList.remove('on'); release(k); release('start'); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});

/* ----------------------------- AUDIO -------------------------------- */
let actx = null, muted = false, master = null, noiseBuf = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.35; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    startMusic();
  } catch (e) { actx = null; }
}
function tone(type, f0, f1, dur, vol = 0.3, when = 0) {
  if (!actx || muted) return;
  const t = actx.currentTime + when;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol = 0.3, freq = 1200) {
  if (!actx || muted) return;
  const t = actx.currentTime, s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur);
}
const sfx = {
  jump: () => tone('square', 330, 660, 0.12, 0.15),
  swing: () => noise(0.08, 0.25, 3000),
  hit: () => { tone('square', 220, 80, 0.12, 0.25); noise(0.06, 0.2, 2000); },
  dig: () => { noise(0.15, 0.35, 700); tone('triangle', 120, 60, 0.12, 0.3); },
  gem: () => { tone('sine', 988, 988, 0.06, 0.2); tone('sine', 1319, 1319, 0.12, 0.2, 0.05); },
  bounce: () => tone('square', 440, 990, 0.1, 0.18),
  hurt: () => { tone('sawtooth', 400, 90, 0.3, 0.25); },
  throw: () => tone('triangle', 600, 300, 0.1, 0.12),
  splat: () => noise(0.12, 0.25, 900),
  check: () => { [523, 659, 784].forEach((f, i) => tone('square', f, f, 0.1, 0.15, i * 0.08)); },
  boom: () => { noise(0.4, 0.4, 500); tone('sawtooth', 120, 40, 0.4, 0.3); },
  win: () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone('square', f, f, 0.15, 0.15, i * 0.12)); },
  whistle: () => tone('square', 1400, 260, 0.7, 0.12),
  die: () => { [392, 330, 262, 196].forEach((f, i) => tone('square', f, f * 0.98, 0.18, 0.18, i * 0.15)); }
};

/* Tiny original chiptune: a driving A-minor action loop */
const N = n => 440 * Math.pow(2, (n - 69) / 12);
const BASS = [45, 0, 57, 45, 0, 45, 57, 0, 41, 0, 53, 41, 0, 41, 53, 0, 43, 0, 55, 43, 0, 43, 55, 0, 40, 0, 52, 40, 0, 40, 52, 52];
const LEAD = [69, 0, 72, 0, 76, 0, 74, 72, 69, 0, 72, 0, 77, 76, 74, 0, 71, 0, 74, 0, 79, 0, 77, 76, 76, 0, 74, 0, 71, 0, 68, 0];
const BOSS_LEAD = [81, 80, 81, 0, 76, 0, 77, 0, 81, 80, 81, 0, 84, 0, 83, 0, 79, 78, 79, 0, 74, 0, 76, 0, 80, 0, 83, 0, 88, 0, 86, 0];
let musicStep = 0, musicNext = 0;
function startMusic() {
  musicNext = actx.currentTime + 0.1;
  setInterval(() => {
    if (!actx || muted) { if (actx) musicNext = actx.currentTime + 0.1; return; }
    const fast = bossActive && !(boss && boss.dead);
    const step = 60 / (fast ? 160 : 136) / 4;
    while (musicNext < actx.currentTime + 0.12) {
      const i = musicStep % 32, playing = state === 'play' || state === 'dead';
      if (playing || state === 'title') {
        const b = BASS[i]; if (b) note('triangle', N(b), musicNext, step * 1.6, 0.22);
        if (playing) { const l = (fast ? BOSS_LEAD : LEAD)[i]; if (l) note('square', N(l), musicNext, step * 0.9, 0.05); }
        if (i % 4 === 0 && playing) hat(musicNext);
      }
      musicNext += step; musicStep++;
    }
  }, 25);
}
function note(type, f, t, dur, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function hat(t) {
  const s = actx.createBufferSource(), g = actx.createGain(), f = actx.createBiquadFilter();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = 7000;
  g.gain.setValueAtTime(0.06, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + 0.05);
}

/* ----------------------------- LEVEL -------------------------------- */
// '#' ground, 'D' diggable dirt, '^' sharpened-pencil spikes, '.' air
const LW = 211, LH = 11;
const ARENA_X = 190, GATE_X = 189;
let grid = [];
function buildGrid() {
  grid = Array.from({ length: LH }, () => Array(LW).fill('.'));
  const F = (x0, x1, y0, y1, c) => {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++)
      if (x >= 0 && x < LW && y >= 0 && y < LH) grid[y][x] = c;
  };
  F(0, LW - 1, 9, 10, '#'); F(0, 0, 0, 8, '#');
  // Act 1: the red carpet
  F(12, 13, 7, 8, 'D'); F(21, 23, 7, 7, '#');
  // Act 2: the pit of bloggers
  F(28, 40, 9, 10, '.'); F(30, 32, 8, 8, '#'); F(35, 37, 7, 7, '#');
  // Act 3: the dirt wall
  F(44, 70, 8, 8, '#'); F(50, 51, 5, 7, 'D'); F(62, 65, 6, 6, '#'); F(66, 67, 6, 7, 'D');
  // Act 4: the pencil pit
  F(78, 100, 9, 9, '^'); F(80, 81, 8, 8, '#'); F(86, 87, 7, 7, '#'); F(92, 93, 7, 7, '#'); F(97, 98, 7, 7, '#');
  // Act 5: the review gauntlet
  F(106, 109, 7, 7, '#'); F(125, 128, 6, 8, 'D'); F(131, 133, 9, 10, '.');
  // Act 6: the stunt sequence (pogo chain)
  F(150, 170, 9, 10, '.');
  F(152, 153, 8, 8, 'D'); F(156, 157, 8, 8, 'D');
  F(160, 162, 8, 8, '#'); F(165, 166, 8, 8, 'D'); F(169, 170, 8, 8, 'D');
  // Finale: the premiere
  F(193, 195, 7, 7, '#'); F(204, 206, 7, 7, '#'); F(LW - 1, LW - 1, 0, 8, '#');
}
const tileAt = (tx, ty) => (tx < 0 || tx >= LW) ? '#' : (ty < 0 || ty >= LH) ? '.' : grid[ty][tx];
const solid = (tx, ty) => { const t = tileAt(tx, ty); return t === '#' || t === 'D'; };

function collideX(e) {
  e.hitWall = false;
  const top = Math.floor(e.y / TS), bot = Math.floor((e.y + e.h - 0.01) / TS);
  if (e.vx > 0) {
    const tx = Math.floor((e.x + e.w - 0.01) / TS);
    for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { e.x = tx * TS - e.w; e.vx = 0; e.hitWall = true; break; }
  } else if (e.vx < 0) {
    const tx = Math.floor(e.x / TS);
    for (let ty = top; ty <= bot; ty++) if (solid(tx, ty)) { e.x = (tx + 1) * TS; e.vx = 0; e.hitWall = true; break; }
  }
}
function collideY(e) {
  e.onGround = false;
  const l = Math.floor(e.x / TS), r = Math.floor((e.x + e.w - 0.01) / TS);
  if (e.vy > 0) {
    const ty = Math.floor((e.y + e.h - 0.01) / TS);
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; break; }
  } else if (e.vy < 0) {
    const ty = Math.floor(e.y / TS);
    for (let tx = l; tx <= r; tx++) if (solid(tx, ty)) { e.y = (ty + 1) * TS; e.vy = 0; break; }
  }
}
function physics(e, g = GRAV) {
  e.vy = Math.min(e.vy + g, 6);
  e.x += e.vx; collideX(e);
  e.y += e.vy; collideY(e);
}

/* --------------------------- GAME STATE ------------------------------ */
let state = 'title', paused = false, frame = 0, takes = 1;
let player, enemies, boss, projectiles, gems, particles, popups, checkpoints;
let cam = { x: 0 }, shake = 0, money = 0, bossActive = false, banner = null, deadT = 0, winT = 0;
let cruiseShown = false, respawnPt = { x: 3, y: 9 };
let bootMeter = 0, superBoot = null;

const TAUNTS = ['C MINUS!', 'ALL STYLE!', 'NO SUBSTANCE!', 'EGO TRIP!', 'TOO MUCH LATEX!', 'WHO IS THAT?!', 'MISFIRE!', 'TEETH?!'];
const RECANTS = ['FINE. A PLUS!', 'TRANSFORMATIVE!', 'A ROMP!', 'BOLD CHOICES!', 'AWARDS SEASON!', 'MASTERPIECE!', 'I GET IT NOW'];
const BLOGS = ['#FLOP', 'FIRST!', 'LOL', 'RATIO', 'MID.', '#DIGGERFAIL'];

function place(e, tx, row) { e.x = tx * TS + (TS - e.w) / 2; e.y = row * TS - e.h; return e; }
function mkEnemy(type, tx, row, extra = {}) {
  const base = { type, vx: 0, vy: 0, inv: 0, flash: 0, stun: 0, dead: false, face: -1, say: null, t: Math.random() * 100 };
  let e;
  if (type === 'critic') e = Object.assign(base, { w: 10, h: 14, hp: 2, dir: -1, cool: 60 + rand(0, 80), throwT: 0 });
  if (type === 'blogger') e = Object.assign(base, { w: 12, h: 12, hp: 1, phase: rand(0, 6) });
  if (type === 'tomato') e = Object.assign(base, { w: 12, h: 14, hp: 2, cool: 80 + rand(0, 60) });
  Object.assign(e, extra);
  place(e, tx, row);
  e.bx = e.x; e.by = e.y;
  return e;
}
function mkBoss() {
  return place({
    type: 'boss', boss: true, w: 24, h: 34, vx: 0, vy: 0, hp: 14, maxHp: 14, inv: 0, flash: 0,
    face: -1, state: 'wait', t: 0, dead: false, say: null, onGround: false, enraged: false
  }, 204, 9);
}
function mkGem(x, y, val, isStatic = false) {
  const colors = { 1: '#b9a6ff', 5: '#ffd84a', 10: '#ffe680', 25: '#ff7a6a' };
  return { x, y, w: 8, h: 8, vx: isStatic ? 0 : rand(-1.5, 1.5), vy: isStatic ? 0 : rand(-3.5, -2), val, c: colors[val], st: isStatic, life: isStatic ? Infinity : 600, t: rand(0, 6) };
}
function dropGems(x, y, total) {
  while (total > 0) {
    const v = total >= 25 && Math.random() < 0.3 ? 25 : total >= 10 && Math.random() < 0.5 ? 10 : total >= 5 ? 5 : 1;
    gems.push(mkGem(x, y, v)); total -= v;
  }
}

function newGame() {
  buildGrid();
  money = 0; takes = 1; cruiseShown = false; bossActive = false; winT = 0; bootMeter = 0; superBoot = null;
  respawnPt = { x: 3, y: 9 };
  enemies = [
    mkEnemy('critic', 18, 9),
    mkEnemy('blogger', 33, 4, { chase: true }), mkEnemy('blogger', 38, 3, { chase: true }),
    mkEnemy('critic', 47, 8), mkEnemy('critic', 58, 8), mkEnemy('tomato', 63, 6),
    mkEnemy('blogger', 84, 6), mkEnemy('blogger', 90, 5), mkEnemy('blogger', 95, 5),
    mkEnemy('tomato', 107, 7), mkEnemy('critic', 113, 9), mkEnemy('critic', 121, 9), mkEnemy('tomato', 139, 9),
    mkEnemy('critic', 178, 9), mkEnemy('critic', 182, 9)
  ];
  boss = mkBoss(); enemies.push(boss);
  gems = [];
  const G = (tx, ty, v = 1) => gems.push(mkGem(tx * TS + 4, ty * TS + 4, v, true));
  [6, 7, 8].forEach(x => G(x, 7)); G(22, 5, 5);
  [29, 33, 34].forEach(x => G(x, 6)); G(36, 4, 5);
  [45, 46, 54, 55, 56].forEach(x => G(x, 6)); G(64, 4, 10);
  G(84, 3, 5); G(90, 2, 5); G(95, 2, 5);
  [111, 112, 116, 117, 118].forEach(x => G(x, 7)); G(132, 6, 5);
  [152, 157, 165, 170].forEach(x => G(x, 4)); G(161, 2, 25);
  [174, 175, 176].forEach(x => G(x, 7));
  checkpoints = [74, 146, 186].map(tx => ({ x: tx * TS + 2, y: 9 * TS - 18, w: 12, h: 18, tx, on: false }));
  projectiles = []; particles = []; popups = [];
  spawnPlayer();
  state = 'play';
  banner = { lines: ['DIGG. OR DIE.', 'SILENCE THE CRITICS'], t: 200 };
}
function spawnPlayer() {
  player = {
    x: respawnPt.x * TS + 3, y: respawnPt.y * TS - 14, w: 10, h: 14, vx: 0, vy: 0, face: 1,
    hp: 8, maxHp: 8, inv: 0, knock: 0, atk: 0, atkCd: 0, atkId: 0, pogo: false, onGround: false,
    coyote: 0, jbuf: 0, runT: 0, sprint: false, combo: 0, bouncing: false
  };
  cam.x = clamp(player.x - VW / 2, 0, LW * TS - VW);
}
function respawn() {
  buildGrid();
  projectiles = []; bossActive = false; superBoot = null; bootMeter = Math.max(bootMeter, 50);
  if (!boss.dead) { const b = mkBoss(); Object.assign(boss, b); }
  takes++;
  spawnPlayer();
  state = 'play';
  banner = { lines: ['TAKE ' + takes, 'ACTION!'], t: 90 };
}

/* --------------------------- EFFECTS ------------------------------- */
function burst(x, y, n, colors, spd = 2, g = 0.15, life = 30) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, Math.PI * 2), s = rand(0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, g, life: rand(life * 0.5, life), c: pick(colors), s: Math.random() < 0.5 ? 1 : 2 });
  }
}
function popup(x, y, text, c = '#fff', t = 60) { popups.push({ x, y, text, c, t, t0: t }); }

function digTile(tx, ty) {
  if (tileAt(tx, ty) !== 'D') return false;
  grid[ty][tx] = '.';
  const cx = tx * TS + 8, cy = ty * TS + 8;
  burst(cx, cy, 14, ['#a0672f', '#6e4420', '#c98a4b', '#3b2412'], 2.5, 0.2, 40);
  sfx.dig(); shake = Math.max(shake, 3); addMeter(2);
  if (Math.random() < 0.85) dropGems(cx - 4, cy - 4, pick([1, 1, 5, 5, 10]));
  return true;
}

/* ----------------------------- PLAYER ------------------------------- */
function hurtPlayer(dmg, srcX) {
  const p = player;
  if (p.inv > 0 || state !== 'play') return;
  p.hp -= dmg; p.inv = 70; p.knock = 14; p.atk = 0; p.pogo = false; p.combo = 0;
  p.vx = (p.x + p.w / 2 < srcX ? -1.8 : 1.8); p.vy = -2.8;
  sfx.hurt(); shake = 6;
  burst(p.x + 5, p.y + 7, 8, ['#f33', '#fff'], 2);
  if (p.hp <= 0) killPlayer();
}
function killPlayer() {
  const p = player;
  p.hp = 0; state = 'dead'; deadT = 150; sfx.die(); banner = null;
  const lost = Math.floor(money * 0.2);
  if (lost > 0) { money -= lost; popup(p.x + 5, p.y - 8, '-$' + lost + 'M', '#f66', 120); }
  burst(p.x + 5, p.y + 7, 25, ['#6b3f1d', '#f2c38f', '#3a5a9a', '#fff'], 3);
}

function updatePlayer() {
  const p = player;
  const move = (keys.left ? -1 : 0) + (keys.right ? 1 : 0);
  // "Cruise control": run long enough and Tom breaks into his trademark full sprint
  if (move && p.onGround && move === p.face) p.runT++;
  if (!move || (move !== p.face && p.onGround)) { p.runT = 0; if (p.onGround || !move) p.sprint = false; }
  if (keys.sprint && move) p.sprint = true;
  if (p.runT > 45 && !p.sprint) {
    p.sprint = true;
    if (!cruiseShown) { cruiseShown = true; popup(p.x + 5, p.y - 10, 'CRUISE CONTROL!', '#ffd84a', 90); }
  }
  const speed = p.sprint ? 2.3 : 1.4;
  if (p.knock > 0) p.knock--;
  else {
    p.vx += (move * speed - p.vx) * (p.onGround ? 0.35 : 0.18);
    if (move && p.atk <= 0) p.face = move;
  }

  // Jump (with coyote time + input buffer)
  if (p.onGround) { p.coyote = 6; p.combo = 0; } else if (p.coyote > 0) p.coyote--;
  if (pressed.jump) p.jbuf = 7; else if (p.jbuf > 0) p.jbuf--;
  if (p.jbuf > 0 && p.coyote > 0 && p.knock <= 0) {
    p.vy = -4.6; p.coyote = 0; p.jbuf = 0; p.onGround = false; p.bouncing = false; sfx.jump();
  }
  if (!keys.jump && p.vy < -2 && !p.bouncing) p.vy = -2;
  if (p.vy >= 0) p.bouncing = false;

  // Shovel swing
  if (p.atkCd > 0) p.atkCd--;
  if (pressed.attack && p.atkCd <= 0 && p.knock <= 0) { p.atk = 16; p.atkCd = 20; p.atkId++; p.pogo = false; sfx.swing(); }
  if (p.atk > 0) p.atk--;

  // THE DIGGER BOOT: a giant cowboy boot stomps everything on screen
  if (pressed.boot && bootMeter >= 100 && !superBoot) {
    bootMeter = 0; sfx.whistle();
    const aim = bossActive && !boss.dead ? boss.x + boss.w / 2 : p.x + p.w / 2 + p.face * 56;
    superBoot = { x: clamp(aim - 36, cam.x + 8, cam.x + VW - 84), y: -150, vy: 2, phase: 'drop', t: 0 };
    banner = { lines: ['DIGG. OR DIE.', 'THE DIGGER BOOT!'], t: 90, y: 18 };
  } else if (pressed.boot && !superBoot) popup(p.x + 5, p.y - 10, 'BOOT ' + Math.floor(bootMeter) + '%', '#aaa', 30);

  // Boot stomp (pogo): hold DOWN in the air
  p.pogo = !p.onGround && keys.down && p.atk <= 0 && p.knock <= 0;

  // Pogo off dirt blocks (checked before landing so the block breaks instead)

/* ----------------------------- ENEMIES ------------------------------ */
function hurtEnemy(e, dmg, fromX) {

  e.hp -= dmg; e.inv = e.boss ? 22 : 10; e.flash = 10; if (e.boss) addMeter(12);

  popup(e.x + e.w / 2, e.y - 4, pick(['BAM!', 'WHACK!', 'POW!', 'BONK!', 'YEEHAW!']), '#fff', 30);
  if (!e.boss) { e.vx = sign(e.x - fromX) * 2; e.vy = -1.5; e.stun = 20; }
  if (e.hp <= 0) killEnemy(e);
  else if (e.boss && !e.enraged && e.hp <= e.maxHp / 2) { e.enraged = true; e.say = { text: "I'M GIVING IT A D!", t: 90 }; }

}
function killEnemy(e) {

    projectiles = []; sfx.boom(); return;
  }
  e.dead = true; addMeter(20);
  burst(e.x + e.w / 2, e.y + e.h / 2, 18, ['#fff', '#ddd', '#c33', '#ffd84a'], 3);
  popup(e.x + e.w / 2, e.y - 10, pick(RECANTS), '#7f7', 80);

function updateEnemy(e) {
  const p = player;
  if (!e.boss) e.t++; // the boss uses t as its own state timer
  if (e.inv > 0) e.inv--; if (e.flash > 0) e.flash--;
  if (e.say && --e.say.t <= 0) e.say = null;
  const dx = (p.x + p.w / 2) - (e.x + e.w / 2), dy = (p.y + p.h / 2) - (e.y + e.h / 2), dist = Math.hypot(dx, dy);

      e.throwT--; e.vx = 0;
      if (e.throwT === 12) {
        sfx.throw();
        projectiles.push({ type: 'review', x: e.x + e.w / 2 - 4, y: e.y + 3, w: 8, h: 6, vx: e.face * 1.9, vy: 0, g: 0, life: 200, t: 0, dmg: 1 });

        if (e.hitWall || !solid(ahead, below)) { e.dir *= -1; e.vx = e.dir * 0.5; }

        e.say = { text: pick(TAUNTS), t: 60 };

      }

          projectiles.push({ type: 'review', x: b.x + b.w / 2, y: b.y + 8, w: 8, h: 6, vx: tdx / d * 1.8, vy: tdy / d * 1.8, g: 0, life: 200, t: 0, dmg: 1 });
        } else projectiles.push({ type: 'tomato', x: b.x + b.w / 2, y: b.y + 6, w: 6, h: 6, vx: clamp(tdx / T, -4, 4), vy: clamp((tdy - 0.5 * g * T * T) / T, -6, 0), g, life: 240, t: 0, dmg: 1 });

      if (--b.t <= 0) {

        burst(b.x + b.w / 2, b.y + b.h / 2, 60, ['#fff', '#ffd84a', '#5b2a86', '#f33'], 4);
        dropGems(b.x + b.w / 2, b.y, 150);
        popup(b.x + b.w / 2, b.y - 10, 'CERTIFIED FRESH!', '#7f7', 160);

}

  } else if (sb.phase === 'stomp') { if (sb.t > 45) sb.phase = 'rise'; }

}

/* ---------------------------- MAIN UPDATE --------------------------- */
function update() {
  frame++;
  if (pressed.mute) muted = !muted;
  if (state === 'title') { if (pressed.start || pressed.jump || pressed.attack) newGame(); return; }
  if (state === 'win') { if (winT > 0) winT--; else if (pressed.start || pressed.jump) state = 'title'; return; }
  if (state === 'play' && pressed.pause) paused = !paused;
  if (paused) return;
  if (banner && --banner.t <= 0) banner = null;

  if (state === 'play') updatePlayer();
  else if (state === 'dead') { if (--deadT <= 0) respawn(); }

  const p = player;
  // Enemies
  const vis = e => e.boss || Math.abs(e.x - p.x) < 260;
  for (const e of enemies) if (!e.dead && vis(e)) updateEnemy(e);

  if (state === 'play') {
    // Pogo hits on enemies
    if (p.pogo && p.vy > 0) {
      const box = { x: p.x, y: p.y + p.h - 4, w: p.w, h: 8 };
      for (const e of enemies) if (!e.dead && overlap(box, e) && p.y + p.h - 6 < e.y + e.h / 2) {
        if (hurtEnemy(e, 1, p.x + p.w / 2) || e.inv > 0) { pogoBounce(); p.inv = Math.max(p.inv, 6); break; }
      }
    }
    // Shovel swing hits
    const sb = swingBox();
    if (sb) {
      for (const e of enemies) if (!e.dead && e.hitBy !== p.atkId && overlap(sb, e)) {
        if (hurtEnemy(e, e.boss ? 1 : 1, p.x + p.w / 2)) e.hitBy = p.atkId;
      }
      const l = Math.floor(sb.x / TS), r = Math.floor((sb.x + sb.w) / TS), t = Math.floor(sb.y / TS), bt = Math.floor((sb.y + sb.h) / TS);
      for (let tx = l; tx <= r; tx++) for (let ty = t; ty <= bt; ty++) digTile(tx, ty);
      for (const pr of projectiles) if (pr.type !== 'ink' && overlap(sb, pr)) {
        pr.life = 0; burst(pr.x + 3, pr.y + 3, 6, ['#fff', '#ffd84a'], 2); popup(pr.x, pr.y - 4, 'DEFLECT!', '#8cf', 30); sfx.bounce();
      }
    }
    // Contact damage
    for (const e of enemies) if (!e.dead && overlap(p, e) && !(e.boss && !['charge', 'air'].includes(e.state))) {
      if (e.stun > 0 && !e.boss) continue;
      hurtPlayer(1, e.x + e.w / 2);
    }
  }

  if (superBoot) updateSuperBoot();

  // Projectiles
  for (const pr of projectiles) {
    pr.t++; pr.life--;
    pr.vy += pr.g; pr.x += pr.vx; pr.y += pr.vy;
    if (pr.type === 'review') pr.y += Math.sin(pr.t * 0.2) * 0.4;
    const tx = Math.floor((pr.x + pr.w / 2) / TS), ty = Math.floor((pr.y + pr.h / 2) / TS);
    if (solid(tx, ty) || pr.y > LH * TS) {
      if (pr.type === 'ink' && !solid(tx, ty - 1) && pr.y < LH * TS) { /* ink rolls along the floor */ }
      else {
        pr.life = 0;
        if (pr.type === 'tomato') { burst(pr.x + 3, pr.y + 3, 10, ['#d22', '#f55', '#7a0'], 1.8); sfx.splat(); }
        else if (pr.type === 'pencil') { burst(pr.x + 2, pr.y + 12, 6, ['#fc3', '#333'], 1.5); }
      }
    }
    if (state === 'play' && pr.life > 0 && overlap(p, pr)) { hurtPlayer(pr.dmg, pr.x + pr.w / 2); pr.life = 0; }
  }
  projectiles = projectiles.filter(pr => pr.life > 0);

  // Gems
  for (const g of gems) {
    g.t += 0.1;
    if (!g.st) {
      g.life--; physics(g, 0.2);
      if (g.onGround) { g.vx *= 0.8; }
      if (g.y > LH * TS + 20) g.life = 0;
    }
    if (state === 'play' && g.life > 0 && overlap(p, g) && (g.st || g.life < 590)) {
      g.life = 0; money += g.val; sfx.gem(); addMeter(g.val >= 10 ? 5 : 2);
      popup(g.x + 4, g.y - 2, '+$' + g.val + 'M', g.c, 35);
    }
  }
  gems = gems.filter(g => g.life > 0);

  // Particles & popups
  for (const pt of particles) { pt.vy += pt.g; pt.x += pt.vx; pt.y += pt.vy; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  for (const pu of popups) { pu.t--; pu.y -= 0.35; }
  popups = popups.filter(pu => pu.t > 0);

  // Camera
  let target = p.x + p.w / 2 - VW / 2 + p.face * 24;
  if (bossActive) target = ARENA_X * TS;
  target = clamp(target, 0, LW * TS - VW);
  cam.x += (target - cam.x) * (bossActive ? 0.08 : 0.12);
  if (shake > 0) shake *= 0.85; if (shake < 0.3) shake = 0;

  if (boss.dead && winT > 0 && --winT <= 0) { state = 'win'; winT = 60; sfx.win(); }
}

function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return (h ^ (h >> 16)) >>> 0; }
function drawTiles(cx) {

  for (let ty = 0; ty < LH; ty++) for (let tx = x0; tx <= x1; tx++) {
    const t = grid[ty][tx], X = tx * TS, Y = ty * TS;
    if (t === '#') {
      R(X, Y, TS, TS, '#5a3620');
      const h = hash(tx, ty);
      R(X + (h % 12) + 1, Y + ((h >> 4) % 10) + 4, 2, 2, '#3e2414');
      R(X + ((h >> 8) % 12) + 1, Y + ((h >> 12) % 10) + 4, 3, 1, '#704829');
      if (!solid(tx, ty - 1)) {
        R(X, Y, TS, 4, '#3d9c4a'); R(X, Y, TS, 1, '#7fd86b');
        R(X + (h % 13), Y + 4, 2, 2, '#3d9c4a'); R(X + ((h >> 5) % 13), Y + 4, 1, 3, '#3d9c4a');
      }
      if (tx === GATE_X && bossActive && ty <= 8) { R(X, Y, TS, TS, '#40303a'); R(X + 2, Y + 2, 12, 12, '#6a5560'); R(X + 6, Y, 4, TS, '#2a1f26'); }
    } else if (t === 'D') {
      R(X, Y, TS, TS, '#6e4420'); R(X + 1, Y + 1, 14, 14, '#a0672f');
      const h = hash(tx, ty);
      R(X + 3, Y + 3, 2, 2, '#c98a4b'); R(X + 10, Y + 5, 3, 2, '#c98a4b'); R(X + 6, Y + 10, 2, 2, '#c98a4b');
      R(X + 2 + (h % 5), Y + 7, 4, 1, '#6e4420'); R(X + 9, Y + 11 - (h % 3), 1, 3, '#6e4420');
      R(X + 1, Y + 1, 14, 1, '#c98a4b');
    } else if (t === '^') {
      for (let k = 0; k < 2; k++) {
        const px = X + k * 8;
        R(px + 1, Y + 9, 6, 7, '#f5c02e'); R(px + 1, Y + 9, 2, 7, '#e09a16'); R(px + 1, Y + 15, 6, 1, '#c9772a');

        R(px + 3, Y + 3, 2, 3, '#333');
      }
    }
  }
}

function drawTom(p, t) {
  const r = painter(p.x - 3, p.y - 2, p.face, 16);

  if (p.sprint && run) { const f = Math.floor(t / 3) % 2; r(f ? 2 : 3, 8, 2, 3, SUITd); } else r(3, 8, 1, 3, SUITd);
  // head: silver swept-back hair, weathered face, those teeth

  // front arm + D-handle spade

}

  for (const e of enemies) {
    if (e.dead || Math.abs(e.x - cam.x - VW / 2) > VW) continue;
    if (e.flash > 0 && frame % 4 < 2) { ctx.save(); ctx.filter = 'brightness(3)'; }
    if (e.type === 'critic') drawCritic(e);
    else if (e.type === 'blogger') drawBlogger(e);
    else if (e.type === 'tomato') drawThrower(e);
    else drawBoss(e);
    if (e.flash > 0 && frame % 4 < 2) ctx.restore();
  }
  for (const pr of projectiles) drawProjectile(pr);
  if (superBoot) drawGiantBoot(superBoot);
  if ((state === 'play' || state === 'win') && !(player.inv > 0 && frame % 4 < 2)) drawTom(player, frame);
  for (const pt of particles) R(pt.x, pt.y, pt.s, pt.s, pt.c);
  for (const e of enemies) if (!e.dead) drawBubble(e);
  for (const pu of popups) {
    ctx.globalAlpha = Math.min(1, pu.t / 15);
    text(pu.text, clamp(pu.x, cam.x + 4 + pu.text.length * 4, cam.x + VW - 4 - pu.text.length * 4), pu.y, pu.c, 'center');
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawTitle() {
  // a pulp-poster homage: paper, three color blocks, a man and his spade
  R(0, 0, VW, VH, '#efe6d4');
  R(16, 6, 144, 74, '#4aa3a8'); R(160, 6, 144, 74, '#8bb04a'); R(16, 80, 288, 48, '#e8582a');
  for (let i = 0; i < 260; i++) { const h = hash(i, 7); R(h % VW, (h >> 9) % VH, 1, 1, '#0000000f'); }
  ctx.font = '8px ' + FONT; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.lineWidth = 2; ctx.strokeStyle = '#111'; ctx.fillStyle = '#4aa3a8';
  for (const [s, y] of [['DIGG.', 14], ['OR DIE.', 26]]) { ctx.strokeText(s, 26, y); ctx.fillText(s, 26, y); }
  ctx.save(); ctx.translate(VW / 2 - 32, 14); ctx.scale(4, 4);
  const fake = { x: 3, y: 2, w: 10, h: 14, face: 1, onGround: true, vx: 0, pogo: false, atk: (frame % 150) < 16 ? 16 - (frame % 150) : 0, sprint: false };
  drawTom(fake, frame);
  ctx.restore();
  ctx.save(); ctx.translate(VW - 74, 46); ctx.scale(2, 2);
  drawCritic({ x: 3, y: 2, w: 10, h: 14, face: -1, vx: 0, t: frame, throwT: 20 });
  ctx.restore();
  if (frame % 90 < 60) { R(VW - 108, 26, 64, 13, '#fff'); R(VW - 66, 39, 4, 3, '#fff'); ctx.fillStyle = '#111'; ctx.fillText('C MINUS', VW - 104, 29); }
  text('TOM CRUISE IS', VW / 2, 92, '#111', 'center');
  ctx.font = '16px ' + FONT; ctx.textAlign = 'center';
  ctx.fillStyle = '#7a1f12'; ctx.fillText('DIGGER', VW / 2 + 2, 106); ctx.fillStyle = '#f6efe0'; ctx.fillText('DIGGER', VW / 2, 104);
  text('VS. THE CRITICS', VW / 2, 132, '#d84a1a', 'center');
  text(frame % 120 < 60 ? 'ONLY IN BROWSERS' : 'PRESS ENTER / TAP', VW / 2, 146, frame % 120 < 60 ? '#d84a1a' : '#111', 'center');
  text('Z JUMP  X DIG  C BOOT', VW / 2, 160, '#555', 'center');
  text('DOWN IN AIR: BOOT STOMP', VW / 2, 170, '#555', 'center');
}
function drawCat(x, y) {
  const c = '#e08a3a';
  R(x, y + 3, 10, 5, c); R(x + 7, y, 5, 5, c); R(x + 7, y - 1, 1, 1, c); R(x + 11, y - 1, 1, 1, c);
  R(x + 8, y + 2, 1, 1, '#111'); R(x + 10, y + 2, 1, 1, '#111'); R(x + 1, y + 8, 1, 2, c); R(x + 7, y + 8, 1, 2, c);
  const tail = Math.floor(frame / 15) % 2; R(x - 2, y + 1 + tail, 2, 3, c); R(x - 3, y - 1 + tail, 1, 3, c);
  R(x + 2, y + 4, 4, 1, '#b8651f');
}
function drawWin() {
  ctx.fillStyle = '#000c'; ctx.fillRect(0, 0, VW, VH);
  text('CRITICS CONSENSUS', VW / 2, 30, '#fff', 'center');
  text('100% FRESH', VW / 2, 46, '#7f7', 'center', 16);
  text('BOX OFFICE: $' + money + 'M', VW / 2, 80, '#ffd84a', 'center');
  text('TAKES NEEDED: ' + takes, VW / 2, 94, '#fff', 'center');
  text(takes === 1 ? 'ONE TAKE. NO STUNT DOUBLE.' : 'HE DOES HIS OWN STUNTS.', VW / 2, 112, '#cbb', 'center');
  text('AND THE CAT IS SAFE.', VW / 2 - 8, 128, '#f9a', 'center'); drawCat(VW / 2 + 82, 126);
  text('DIGG. OR DIE.', VW / 2, 140, '#ffd84a', 'center');
  if (winT <= 0 && frame % 60 < 40) text('PRESS ENTER', VW / 2, 158, '#fff', 'center');
}

function draw() {
  ctx.imageSmoothingEnabled = false;
  if (state === 'title') { drawTitle(); return; }
  drawWorld();
  drawHUD();
  if (state === 'dead') {
    const k = 1 - Math.max(0, deadT - 60) / 90;
    ctx.fillStyle = `rgba(0,0,0,${0.6 * k})`; ctx.fillRect(0, 0, VW, VH);
    if (deadT < 120) text('CUT!', VW / 2, 70, '#f44', 'center', 16);
    if (deadT < 90) text("WE'LL GO AGAIN.", VW / 2, 96, '#fff', 'center');
  }
  if (banner) {
    const a = Math.min(1, banner.t / 20);
    const by = banner.y || 62;
    ctx.globalAlpha = a; R(0, by, VW, 34, '#000b');
    text(banner.lines[0], VW / 2, by + 6, '#ffd84a', 'center'); text(banner.lines[1], VW / 2, by + 20, '#fff', 'center');
    ctx.globalAlpha = 1;
  }
  if (paused) { R(0, 0, VW, VH, '#0008'); text('PAUSED', VW / 2, 80, '#fff', 'center', 16); }
  if (state === 'win') drawWin();
}

/* ------------------------------ LOOP -------------------------------- */
let last = performance.now(), acc = 0;
function step() { update(); for (const k in pressed) pressed[k] = false; }
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) {
    if (!window.__freeze) step();
    acc -= 1000 / 60;
  }
  draw();
  requestAnimationFrame(loop);
}
buildGrid();
(document.fonts ? document.fonts.load('8px "Press Start 2P"').catch(() => {}) : Promise.resolve()).finally(() => requestAnimationFrame(loop));
window.__game = { get state() { return state; }, get player() { return player; }, get boss() { return boss; }, get money() { return money; }, get projectiles() { return projectiles; }, get superBoot() { return superBoot; }, get enemies() { return enemies; }, setMeter: v => { bootMeter = v; }, newGame, keys, pressed, step, grid: () => grid };
</script>
